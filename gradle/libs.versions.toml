[versions]
compileSdk = "35"
applicationId = "com.jiyi.power"
minSdkVersion = "26"
targetSdkVersion = "35"
versionCode = "7"
versionName = "1.0.6"

kotlin = "2.1.10"
androidGradlePlugin = "8.5.2"

retrofit = "2.11.0"
appcompat = "1.7.0"
coreKtx = "1.15.0"
material = "1.9.0"
lifecycleKtx = "2.8.7"
junit = "4.13.2"
junitExt = "1.1.3"
espressoCore = "3.4.0"
banner = "2.2.2"
bravh = "3.0.14"
coil = "2.7.0"
materialDialogs = "3.1.1"
utilCode = "1.31.1"
arouter = "1.5.2"

# Compose
composeBom = "2024.12.01"
activityCompose = "1.9.3"
constraintlayout = "2.2.1"

[libraries]
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
coreKtx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
atKtx = { module = "androidx.activity:activity-ktx", version = "1.10.1" }
ftKtx = { module = "androidx.fragment:fragment-ktx", version = "1.8.6" }
material = { module = "com.google.android.material:material", version.ref = "material" }
viewModelKtx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycleKtx" }
runtimeKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleKtx" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
converterGson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttpLogging = { module = "com.squareup.okhttp3:logging-interceptor", version = "4.10.0" }
okhttp3 = { module = "com.squareup.okhttp3:okhttp", version = "4.10.0" }
netCache = { module = "com.github.AleynP:net-cache", version = "1.0.0" }

junit = { module = "junit:junit", version.ref = "junit" }
androidTestJunit = { module = "androidx.test.ext:junit", version.ref = "junitExt" }
espressoCore = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
banner = { module = "io.github.youth5201314:banner", version.ref = "banner" }
bravh = { module = "io.github.cymchad:BaseRecyclerViewAdapterHelper", version.ref = "bravh" }
refreshKernel = { module = "io.github.scwang90:refresh-layout-kernel", version = "2.1.0" }
refreshHeader = { module = "io.github.scwang90:refresh-header-classics", version = "2.1.0" }
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
dialogs = { module = "com.afollestad.material-dialogs:lifecycle", version.ref = "materialDialogs" }
dialogsCore = { module = "com.afollestad.material-dialogs:core", version.ref = "materialDialogs" }
utilCode = { module = "com.blankj:utilcodex", version.ref = "utilCode" }
arouterApi = { module = "com.alibaba:arouter-api", version.ref = "arouter" }
arouterCompiler = { module = "com.alibaba:arouter-compiler", version.ref = "arouter" }

# BLE Libraries
ble-gson = { module = "com.google.code.gson:gson", version = "2.8.5" }
ble-rxandroid = { module = "io.reactivex.rxjava3:rxandroid", version = "3.0.0" }
ble-rxjava = { module = "io.reactivex.rxjava3:rxjava", version = "3.0.10" }
ble-logger = { module = "com.orhanobut:logger", version = "2.2.0" }

# Compose Libraries
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleKtx" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleKtx" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

[bundles]
androidX = ["appcompat", "coreKtx", "atKtx", "ftKtx", "viewModelKtx", "runtimeKtx"]
netWork = ["retrofit", "converterGson", "okhttp3", "okhttpLogging", "netCache"]
compose = ["compose-ui", "compose-ui-graphics", "compose-ui-tooling-preview", "compose-material3", "activity-compose", "lifecycle-runtime-compose", "lifecycle-viewmodel-compose"]
bleSDK = ["ble-gson", "ble-rxandroid", "ble-rxjava", "ble-logger"]

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
